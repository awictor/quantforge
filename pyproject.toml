[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "0.9.0"
description = "Fast, dependency-free options pricing and risk engine (Black-Scholes-Merton, Greeks, implied vol, American binomial)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Alex Wictor" }]
keywords = ["options", "black-scholes", "greeks", "implied-volatility", "quant", "finance", "derivatives", "pricing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.scripts]
quantforge = "quantforge.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/awictor/quantforge"
Issues = "https://github.com/awictor/quantforge/issues"

[tool.setuptools.packages.find]
include = ["quantforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
