[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
dynamic = ["version"]
description = "Fast, dependency-free options pricing and risk engine (Black-Scholes-Merton, Greeks, implied vol, American binomial)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Alex Wictor" }]
keywords = ["options", "black-scholes", "greeks", "implied-volatility", "quant", "finance", "derivatives", "pricing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.scripts]
quantforge = "quantforge.cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3"]
fast = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/awictor/quantforge"
Issues = "https://github.com/awictor/quantforge/issues"

[tool.setuptools.dynamic]
version = { attr = "quantforge.__version__" }

[tool.setuptools.packages.find]
include = ["quantforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run across all cores by default (pytest-xdist). The suite is ~1700 independent
# tests with no shared state, so distribution is safe and cuts the fast gate
# from ~55s to ~12s on a 24-core box. Override with '-n0' for a serial run.
addopts = "-n auto"
markers = [
    "slow: Monte Carlo / deep-tree tests; deselect with '-m \"not slow\"' for a fast run.",
]
